apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: gaia
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/gaia-project/ai-service:latest
          ports:
            - containerPort: 8090
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: gaia
spec:
  selector:
    app: ai-service
  ports:
    - port: 80
      targetPort: 8090