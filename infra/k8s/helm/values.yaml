global:
  namespace: gaia

ingestion:
  replicaCount: 1
  image:
    repository: ghcr.io/gaia-project/ingestion
    tag: latest
  service:
    port: 8081

scenario:
  replicaCount: 1
  image:
    repository: ghcr.io/gaia-project/scenario
    tag: latest
  service:
    port: 8082

