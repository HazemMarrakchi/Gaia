global:
  namespace: gaia

ingestion:
  replicaCount: 1
  image:
    repository: ghcr.io/gaia-project/ingestion
    tag: latest
  service:
    port: 8181

scenario:
  replicaCount: 1
  image:
    repository: ghcr.io/gaia-project/scenario
    tag: latest
  service:
    port: 8282

aiService:
  replicaCount: 1
  image:
    repository: ghcr.io/gaia-project/ai-service
    tag: latest
  service:
    port: 8091

redis:
  host: "gaia-redis"
  port: 6379

postgres:
  jdbcUrl: "jdbc:postgresql://gaia-postgres:5432/gaia"

kafka:
  bootstrapServers: "kafka:9092"