global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "ingestion-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8181"]

  - job_name: "scenario-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: "ai-service"
    static_configs:
      - targets: ["host.docker.internal:8091"]